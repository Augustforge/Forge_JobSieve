[project]
name = "vacancy-match"
version = "0.1.0"
description = "Two-stage vacancy ranking: resume fit with embeddings, then the candidate's own terms, measured on real decisions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
model = ["sentence-transformers>=3.0"]

[project.scripts]
vm = "vacancy_match.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacancy_match"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the real embedding model (downloads it on first run)"]
addopts = "-m \"not model\""
